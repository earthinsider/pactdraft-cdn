name: Deploy CDN
on:
  push:
    branches: [main]
    paths: ['image/**', 'index.html', 'robots.txt']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check files and size
        run: |
          mkdir -p image
          n=0; total=0
          for f in image/*.*; do
            [ -f "$f" ] || continue
            b=$(basename "$f"); [ "$b" = "README.txt" ] && continue
            echo "$b" | grep -Eq '^[a-z0-9][a-z0-9-]*\.(webp|jpg|jpeg|png|avif|gif)$' || echo "::warning::bad file name $b (use <article-slug>.<ext>, lowercase)"
            s=$(stat -c %s "$f"); n=$((n + 1)); total=$((total + s))
            if [ "$s" -gt 153600 ]; then echo "::warning::$b is $((s / 1024)) KB (over 150 KB)"; fi
          done
          mb=$(du -sm image | cut -f1)
          if [ "$n" -gt 0 ]; then
            avg=$((total / n / 1024)); [ "$avg" -lt 1 ] && avg=1
            left=$(( (700 - mb) * 1024 / avg )); [ "$left" -lt 0 ] && left=0
            echo "image/ = ${mb} MB, ${n} images, average ${avg} KB, room for about ${left} more before the 700 MB warning"
          else
            echo "image/ is empty"
          fi
          if [ "$mb" -gt 900 ]; then echo "::error::over 900 MB: create pactdraft-cdn-2 now"; exit 1; fi
          if [ "$mb" -gt 700 ]; then echo "::warning::over 700 MB: prepare pactdraft-cdn-2"; fi
      - name: Prepare site folder
        run: |
          mkdir _site
          cp -r image index.html robots.txt _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
