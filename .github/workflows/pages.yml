name: Deploy CDN
on:
  push:
    branches: [main]
    paths: ['image/**', 'scripts/**', 'index.html', 'robots.txt', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore feature/card cache
        uses: actions/cache@v4
        with:
          path: .cache/variants
          key: variants-${{ github.run_id }}
          restore-keys: variants-
      - name: Make feature and card files (not committed to git)
        continue-on-error: true
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/make_variants.py
      - name: Prepare site folder
        run: |
          mkdir -p _site/image
          cp image/*.* _site/image/ 2>/dev/null || true
          cp index.html robots.txt _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
      - name: Check files and size
        run: |
          n=0; total=0
          for f in image/*.*; do
            [ -f "$f" ] || continue
            b=$(basename "$f"); [ "$b" = "README.txt" ] && continue
            echo "$b" | grep -Eq '^[a-z0-9][a-z0-9-]*\.(webp|jpg|jpeg|png|avif|gif)$' || echo "::warning::bad file name $b (use <article-slug>.<ext>, lowercase)"
            s=$(stat -c %s "$f"); n=$((n + 1)); total=$((total + s))
            if [ "$s" -gt 153600 ]; then echo "::warning::$b is $((s / 1024)) KB (over 150 KB)"; fi
          done
          mb=$(du -sm _site/image | cut -f1)
          if [ "$n" -gt 0 ]; then
            per=$(( $(du -sk _site/image | cut -f1) / n )); [ "$per" -lt 1 ] && per=1
            left=$(( (700 - mb) * 1024 / per )); [ "$left" -lt 0 ] && left=0
            echo "published image/ = ${mb} MB for ${n} articles (about ${per} KB each with feature and card). Room for about ${left} more before the 700 MB warning."
          else
            echo "image/ is empty"
          fi
          if [ "$mb" -gt 900 ]; then echo "::error::published size is over 900 MB: create pactdraft-cdn-2 now"; exit 1; fi
          if [ "$mb" -gt 700 ]; then echo "::warning::published size is over 700 MB: prepare pactdraft-cdn-2"; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
