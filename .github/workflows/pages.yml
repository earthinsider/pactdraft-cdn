name: Deploy CDN
on:
  push:
    branches: [main]
    paths: ['image/**', 'index.html', 'robots.txt']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check files and size
        run: |
          mkdir -p image/feature image/card
          for f in image/*.*; do
            [ -f "$f" ] || continue
            b=$(basename "$f"); [ "$b" = "README.txt" ] && continue
            n="${b%.*}"
            echo "$b" | grep -Eq '^[a-z0-9][a-z0-9-]*\.(webp|jpg|jpeg|png|avif|gif)$' || echo "::warning::bad file name $b (use <article-slug>.<ext>, lowercase)"
            ls image/feature/"$n".* > /dev/null 2>&1 || echo "::warning::$n has no feature file (home falls back to the big file)"
            ls image/card/"$n".* > /dev/null 2>&1 || echo "::warning::$n has no card file (cards fall back to the big file)"
            s=$(stat -c %s "$f"); if [ "$s" -gt 307200 ]; then echo "::warning::hero $b is $((s / 1024)) KB (over 300 KB)"; fi
          done
          for f in image/feature/*.*; do
            [ -f "$f" ] || continue
            [ "$(basename "$f")" = "README.txt" ] && continue
            s=$(stat -c %s "$f"); if [ "$s" -gt 81920 ]; then echo "::warning::feature $(basename "$f") is $((s / 1024)) KB (over 80 KB)"; fi
          done
          for f in image/card/*.*; do
            [ -f "$f" ] || continue
            [ "$(basename "$f")" = "README.txt" ] && continue
            s=$(stat -c %s "$f"); if [ "$s" -gt 40960 ]; then echo "::warning::card $(basename "$f") is $((s / 1024)) KB (over 40 KB)"; fi
          done
          mb=$(du -sm image | cut -f1)
          echo "image/ = ${mb} MB (GitHub Pages limit is about 1000 MB)"
          if [ "$mb" -gt 900 ]; then echo "::error::over 900 MB: create pactdraft-cdn-2 now"; exit 1; fi
          if [ "$mb" -gt 700 ]; then echo "::warning::over 700 MB: prepare pactdraft-cdn-2"; fi
      - name: Prepare site folder
        run: |
          mkdir _site
          cp -r image index.html robots.txt _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
